<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة مسارات حماية الملكية الفكرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: formal and calm, the same voice as the governance document itself.
   IDEA: the printed governance guide turned into a website — letterhead, teal section bars, grey panels.
   PICTURE: the flow from request to the Standing Committee to the five tracks, in the document's teal and grey.
   COLOUR and TYPE: white page, document teal #3d7e74 with bar teal #4a8678, grey panels #f1f3f2, grey headline words; Readex Pro.
   LAYOUT: letterhead bar, a cover-like hero, then sections each opened by a teal bar over a grey panel. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#121716);--paper:light-dark(#f1f3f2,#1b2321);--tile:light-dark(#eceeed,#222b29);--card:light-dark(#ffffff,#18201e);
--ink:light-dark(#262b2a,#e4ebe9);--mute:light-dark(#6b7270,#9eaaa7);--grey:light-dark(#8b8f8e,#a9b1af);--line:light-dark(#e1e5e3,#2c3634);
--teal:light-dark(#3d7e74,#73b3a8);--bar:#4a8678;--pill:light-dark(#dcebe7,#2c4440)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "Readex Pro",Tahoma,sans-serif;overflow-x:clip}
a{color:inherit}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}.top :focus-visible{outline-color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(4vw,16px)}
/* letterhead */
.top{position:sticky;top:0;z-index:20;background:#4a8678;color:#fff;box-shadow:0 2px 12px rgba(20,50,45,.18)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:76px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;flex:none}
.brand img{height:48px;width:auto}
.brand .sep{width:1px;height:42px;background:rgba(255,255,255,.35)}
.brand b{display:block;font-size:16px;font-weight:700;line-height:1.35}
.brand span{display:block;font-size:12.5px;color:rgba(255,255,255,.82);line-height:1.35}
.brand em{display:block;font-style:normal;font-size:12.5px;color:#dcebe7;font-weight:600;line-height:1.35}
nav.main{display:flex;gap:4px;overflow-x:auto;margin-inline-start:auto;scrollbar-width:none}
nav.main a{flex:none;text-decoration:none;font-size:14.5px;padding:9px 14px;border-radius:10px;color:rgba(255,255,255,.88);min-height:44px;display:flex;align-items:center}
nav.main a:hover{background:rgba(255,255,255,.14);color:#fff}
nav.main a.on{background:#fff;color:#3d7e74;font-weight:600}
/* hero (cover) */
.hero{background:linear-gradient(180deg,var(--bg),var(--paper))}
.hero .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,4vw,56px);align-items:center;padding-block:clamp(30px,5vw,60px)}
.hero h1{font-size:clamp(34px,4.6vw,54px);line-height:1.15;margin:0;font-weight:700;text-wrap:balance;color:var(--teal)}
.hero h1 span{display:block;color:var(--grey)}
.hero .rule{height:1px;background:var(--line);margin:16px 0 12px;max-width:440px}
.hero p{font-size:17px;color:var(--mute);margin:0 0 22px;max-width:46ch}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;max-width:520px}
.facts div{padding:10px 12px;font-size:13px;color:var(--mute);text-align:center;border-inline-start:1px solid var(--line)}
.facts div:first-child{border:0}
.facts b{display:block;font-size:22px;color:var(--teal);font-weight:700;line-height:1.3}
.flow{width:100%;height:auto;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border-radius:12px;border:1px solid transparent;font-size:15px;font-weight:500;text-decoration:none;transition:background .15s}
.btn.pri{background:var(--bar);color:#fff}.btn.pri:hover{background:#3d7268}
.btn.ghost{border-color:var(--line);background:var(--card);color:var(--ink)}.btn.ghost:hover{border-color:var(--teal)}
.btn.soft{background:var(--tile);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px}
/* sections */
.band{padding:clamp(28px,4vw,52px) 0}
.band.paper{background:var(--paper)}
h2{font-size:clamp(22px,2.4vw,28px);line-height:1.3;margin:0 0 8px;font-weight:700;color:var(--teal);text-wrap:balance}
h3{font-size:18px;margin:0 0 6px;font-weight:600;line-height:1.45;color:var(--teal)}
.lead{color:var(--mute);margin:0 0 22px;max-width:70ch}
.ttl{text-align:center;margin-bottom:22px}.ttl h2{color:var(--grey);font-size:clamp(22px,2.6vw,30px)}
/* track tiles, like the cover */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:16px}
.file{background:var(--tile);border-radius:16px;padding:22px 20px 18px;text-decoration:none;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;transition:transform .2s,box-shadow .2s}
.file:hover{transform:translateY(-3px);box-shadow:0 12px 26px -18px rgba(30,70,62,.5)}
.file .ic{color:var(--teal);margin-bottom:2px}
.file .k{font-size:19px;font-weight:700;color:var(--teal)}
.file h3{color:var(--ink);font-weight:500;font-size:15.5px}
.file p{margin:0;color:var(--mute);font-size:14px;line-height:1.7}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:auto;padding-top:8px}
.tag{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--card);color:var(--ink);white-space:nowrap}
.tag.g{background:var(--pill);color:var(--teal);font-weight:500}
/* section = teal bar over grey panel, as in the document */
.sec{background:var(--paper);border-radius:16px;overflow:hidden;margin-bottom:26px;padding:0 20px 20px}
.sec>h2{margin:0 -20px 18px;padding:12px 20px;background:var(--bar);color:#fff;font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
.sec>h2 .pl{background:var(--pill);color:var(--teal);font-size:13.5px;padding:1px 10px;border-radius:7px;font-weight:600}
:root[data-theme=dark] .sec>h2 .pl{color:#cfe5e0}
.sec>.lead{margin-bottom:14px}
.helper{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.q{background:var(--card);border-radius:14px;padding:16px 18px;border-inline-start:3px solid var(--teal)}
.q .qs{font-weight:500;margin-bottom:10px}
.ans{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.ans small{color:var(--mute)}.ans h3{font-size:22px;margin:4px 0 8px}
.ans p{color:var(--ink);margin:0 0 14px}
/* page head */
.thead{background:linear-gradient(180deg,var(--bg),var(--paper));border-bottom:1px solid var(--line)}
.thead .wrap{padding-block:clamp(24px,4vw,40px)}
.crumb{font-size:14px;color:var(--mute);margin-bottom:10px}.crumb a{color:var(--teal)}
.thead h1{font-size:clamp(28px,3.6vw,42px);line-height:1.2;margin:0 0 10px;font-weight:700;color:var(--teal);text-wrap:balance}
.thead .num{display:inline-block;background:var(--pill);color:var(--teal);font-size:14px;font-weight:600;padding:2px 12px;border-radius:8px;margin-bottom:10px}
.thead p{color:var(--mute);max-width:72ch;margin:0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;margin-top:22px}
.kv div{padding:12px 16px;font-size:13.5px;color:var(--teal);font-weight:600;border-inline-start:1px solid var(--line)}
.kv div:first-child{border-inline-start:0}
.kv b{display:block;color:var(--ink);font-size:15px;font-weight:500;line-height:1.6;margin-top:2px}
.tgrid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:26px;align-items:start}
.side{position:sticky;top:96px;display:grid;gap:16px}
.doc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.doc .th{display:block;width:100%;border:0;padding:0;background:var(--paper);aspect-ratio:794/560;overflow:hidden;position:relative}
.doc .th img{width:100%;display:block}
.doc .th::after{content:"معاينة";position:absolute;inset-inline-end:12px;bottom:12px;background:var(--bar);color:#fff;font-size:13px;padding:4px 12px;border-radius:999px}
.doc .bd{padding:16px}
.doc .bd p{margin:0 0 12px;color:var(--mute);font-size:14px;line-height:1.7}
.doc .row .btn{flex:1 1 auto;font-size:14px;padding:8px 12px}
ol.steps{list-style:none;margin:0;padding:0}
ol.steps>li{position:relative;padding:0 50px 16px 0;margin:0}
ol.steps>li::before{content:attr(data-n);position:absolute;right:0;top:2px;width:34px;height:34px;border-radius:9px;background:var(--pill);color:var(--teal);display:grid;place-items:center;font-weight:700;font-size:15px}
ol.steps p{margin:4px 0 0}
ul.sub{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
ul.sub li{background:var(--card);border-radius:10px;padding:10px 14px;font-size:15px;border-inline-start:3px solid var(--teal)}
ul.sub b{color:var(--teal);margin-inline-end:6px}
.intro{background:var(--card);border-radius:12px;padding:12px 16px;margin:0 0 18px;color:var(--ink)}
.fields{display:grid;gap:10px}
.fields .grp{background:var(--card);border-radius:12px;padding:14px 16px;border-inline-start:3px solid var(--teal)}
.fields h4{margin:0 0 10px;font-size:15.5px;font-weight:600;color:var(--teal)}
.fl{display:flex;flex-wrap:wrap;gap:8px}
.fl span{font-size:14px;padding:5px 12px;border-radius:8px;background:var(--paper)}
.fl span i{font-style:normal;color:var(--mute);font-size:12.5px;margin-inline-start:6px;direction:ltr;unicode-bidi:isolate}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:6px}
.toc{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px}
.toc a{flex:none;text-decoration:none;font-size:14px;padding:8px 14px;border-radius:10px;background:var(--paper);min-height:40px;display:flex;align-items:center}
@media(min-width:900px){.toc{position:sticky;top:77px;z-index:5;background:var(--bg);padding-top:10px}}
.defs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.defs div{background:var(--card);border-radius:12px;padding:12px 16px;border-inline-start:3px solid var(--teal)}
.defs b{display:block;color:var(--teal);font-weight:600}
.search{display:flex;gap:10px;margin-bottom:18px}
.search input{flex:1;font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:46px}
mark{background:color-mix(in srgb,var(--teal) 25%,transparent);color:inherit;border-radius:3px}
.empty{color:var(--mute);padding:20px;text-align:center;background:var(--paper);border-radius:12px}
dialog{border:0;padding:0;width:min(940px,96vw);max-height:94vh;border-radius:18px;background:var(--card);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(20,30,28,.65)}
.vh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2;flex-wrap:wrap}
.vh b{flex:1;font-weight:600;font-size:16px;color:var(--teal)}
.vb{overflow:auto;max-height:calc(94vh - 70px);padding:16px;background:var(--paper);display:grid;gap:14px;justify-items:center}
.vb img{width:100%;max-width:820px;background:#fff;border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14.5px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
details.qa{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.qa summary{list-style:none;cursor:pointer;padding:15px 18px;font-weight:500;display:flex;gap:12px;align-items:center;min-height:52px}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::after{content:"+";margin-inline-start:auto;font-size:22px;color:var(--teal2);flex:none;line-height:1}
details.qa[open] summary::after{content:"−"}
details.qa[open]{border-color:var(--teal2)}
details.qa .a{padding:0 18px 16px;color:var(--ink)}
details.qa .a p{margin:0 0 8px}
details.qa .ref{font-size:13px;color:var(--mute)}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cats button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 16px;min-height:40px;font-size:14px}
.cats button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.faqcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 18px}
@media(max-width:900px){.faqcols{grid-template-columns:minmax(0,1fr)}}
footer{border-top:1px solid var(--line);color:var(--mute);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 30px;justify-content:space-between;padding-block:22px}
footer .em{color:var(--teal);direction:ltr}
@media(max-width:900px){.hero .wrap,.tgrid,.helper{grid-template-columns:minmax(0,1fr)}.side{position:static}.brand span,.brand .sep{display:none}}
@media(max-width:600px){.top .wrap{flex-wrap:wrap;gap:6px;padding-block:8px}nav.main{margin:0;width:100%}.brand img{height:40px}.defs{grid-template-columns:minmax(0,1fr)}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.facts div:nth-child(3){border-inline-start:0}.facts div:nth-child(n+3){border-top:1px solid var(--line)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<a class="brand" href="#home"><img src="img/logo-white.png" alt="شعار جامعة تبوك"><i class="sep"></i><div><b>جامعة تبوك</b><span>وكالة الجامعة للدراسات العليا والبحث العلمي</span><em>مكتب نقل التقنية</em></div></a>
<nav class="main" id="nav"></nav>
</div></header>
<main id="app"></main>
<footer><div class="wrap"><div>مكتب نقل التقنية — جامعة تبوك · حوكمة مسارات حماية الملكية الفكرية، الإصدار الأول</div><div class="em">TTO@ut.edu.sa</div></div></footer>
<dialog id="dlg"><div class="vh"><b id="dt"></b><div class="row" id="da"></div><button class="x" id="dx" aria-label="إغلاق">×</button></div><div class="vb" id="db"></div></dialog>

<script id="gov" type="application/json">{"def_intro": "يُقصد بالألفاظ والعبارات الآتية، أينما وردت في هذه الحوكمة، المعاني المبيّنة أمام كل منها، ما لم يقتضِ السياق خلاف ذلك:", "defs": [["الجامعة", "جامعة تبوك."], ["مكتب نقل التقنية", "مكتب نقل التقنية بوكالة الجامعة للدراسات العليا والبحث العلمي."], ["اللجنة الدائمة", "اللجنة الدائمة بالجامعة."], ["الدليل", "دليل سياسات الملكية الفكرية والحاضنة بجامعة تبوك."], ["المنصة المعتمدة", "المنصة الإلكترونية التي تعتمدها الجامعة لتقديم الطلبات، ويجري من خلالها التواصل والتبليغ."], ["المبتكر", "عضو هيئة التدريس أو الموظف أو الطالب أو الباحث، أو غيرهم ممن تسري عليهم سياسات الجامعة، صاحب الاختراع أو الابتكار، منفرداً أو ضمن فريق ابتكاري، ويشمل المخترع والباحث أينما وردا."], ["الفريق الابتكاري", "المبتكرون المشتركون في اختراع أو ابتكار واحد، ولا يُعد مشتركاً من اقتصرت جهوده على المساعدة في التنفيذ دون المساهمة بشكل جوهري في التوصل إليه."], ["الطلب", "طلب حماية الملكية الفكرية الذي يقدّمه المبتكر عبر المنصة المعتمدة، سواء أكان براءة اختراع، أم نموذج منفعة، أم تصميماً، أم تصميماً تخطيطياً للدارات المتكاملة، أم صنفاً نباتياً، أم غيرها من وثائق الحماية."], ["البراءة الممنوحة", "براءة الاختراع التي صدر لها قرار حماية (ممنوحة) من أحد مكاتب براءات الاختراع المعتمدة من المجلس العلمي بالجامعة، سواء أكان داخل المملكة العربية السعودية أم خارجها."], ["الإيداع", "تقديم الطلب لدى الهيئة السعودية للملكية الفكرية محلياً، أو لدى المكاتب الدولية بقرار من اللجنة الدائمة."], ["تقرير الأهلية", "تقرير يبيّن أصالة فكرة الاختراع وقابليتها لمنح البراءة، يُعد من الجهات أو وفق النماذج التي تعتمدها اللجنة الدائمة، ويُرفق بالطلب أساساً عند عرضه عليها."], ["مسارات الحماية", "المسارات الخمسة الواردة في هذه الحوكمة، التي تحدد من يتحمّل الرسوم والتزامات كل طرف."], ["الجهة المستضيفة", "الجامعة أو الجهة التي يُبتعث أو يُوفد إليها المبتكر."]], "general": ["تُعالج طلبات حماية الملكية الفكرية، بما في ذلك براءات الاختراع، ونماذج المنفعة، والتصاميم، والتصميمات التخطيطية للدارات المتكاملة، والأصناف النباتية، وغيرها من وثائق الحماية محلياً-وللجنة التوصية بالإيداع دولياً- وفق المسارات الخمسة الآتية. ويكون تحمّل الجامعة للرسوم بقرار من اللجنة الدائمة لكل طلب، بناءً على تقرير الأهلية، ووفق الميزانية المعتمدة. وإذا لم تتحمّل الجامعة الرسوم، جاز للمبتكر تحمّلها إن رغب في ذلك. ويُقصد بالرسوم في هذه الحوكمة جميع الرسوم المتعلقة بالبراءة، بما فيها رسوم الإيداع والفحص والتسجيل والصيانة، ويشمل ذلك المقابل المالي المنصوص عليه في الأنظمة ذات العلاقة. وإذا تعلق الاختراع بالأمن الوطني، فلا يجوز إيداعه خارج المملكة قبل موافقة الهيئة السعودية للملكية الفكرية، ويُعامل بسرية تامة."], "tracks_intro": "تدرس اللجنة الدائمة جدوى الإيداع، إضافةً إلى تقرير الأهلية المقدَّم مع الطلب، وتوصي بتحديد مسار الحماية الخاصة بكل طلب.", "tracks": [{"name": "المسار الأول", "title": "تحمّل الجامعة للرسوم", "intro": "يبدأ هذا المسار عند تقديم المبتكر الطلب عبر المنصة المعتمدة، مرفقاً به تقرير الأهلية، ويسير وفق الإجراءات الآتية:", "items": [{"n": "١", "t": "تدرس اللجنة الدائمة جدوى الإيداع، إضافةً إلى تقرير الأهلية المقدَّم مع الطلب، وتقرر ما إذا كانت الجامعة ستتحمّل الرسوم.", "sub": []}, {"n": "٢", "t": "تتحمّل الجامعة الرسوم كاملةً إذا وافقت اللجنة الدائمة على ذلك، ويُودع الطلب باسم الجامعة.", "sub": []}, {"n": "٣", "t": "في حال عدم موافقة اللجنة الدائمة على تحمّل الجامعة للرسوم، ينتقل الطلب إلى المسار الثاني.", "sub": []}, {"n": "٤", "t": "في حال الموافقة على تحمّل الجامعة الرسوم، تدرس اللجنة الدائمة وثائق البراءات الممنوحة قبل ستين (60) يوماً على الأقل من تاريخ استحقاق رسوم الصيانة، أياً كانت دورية استحقاقها (سنوية أو غير سنوية)، وتقرر الاستمرار في سداد رسوم الصيانة أو التوقف عنه. فإن قررت التوقف، يُشعَر المبتكر بقرارها، ويُتاح له خيار تحمّل رسوم الصيانة اللاحقة وفق المسار الثاني، بقرار من اللجنة الدائمة، على أن يُبدي رغبته في ذلك خلال ثلاثين (30) يوماً من تاريخ الإشعار.", "sub": []}]}, {"name": "المسار الثاني", "title": "تحمّل المبتكر للرسوم", "intro": "يبدأ هذا المسار في حال قررت اللجنة الدائمة عدم تحمّل الجامعة لرسوم البراءة، ويسير وفق الإجراءات الآتية:", "items": [{"n": "١", "t": "يبلّغ مكتب نقل التقنية المبتكرَ عبر المنصة المعتمدة بقرار اللجنة الدائمة بعدم تحمّل الرسوم، ويَعرض عليه تحمّل الرسوم كاملةً، بما فيها رسوم الصيانة.", "sub": []}, {"n": "٢", "t": "إذا لم يُبلغ المبتكر عن اختياره خلال ثلاثين يوماً من تاريخ التبليغ، عُدّ ذلك عدولاً عن الإيداع، ويُحفظ الملف دون إيداع، مع بقاء حق الجامعة في الاختراع.", "sub": []}, {"n": "٣", "t": "للمبتكر أن يختار أحد أمرين:", "sub": [{"n": "أ", "t": "إيداع الطلب باسم الجامعة على نفقته وفق أحكام هذا المسار، مع احتفاظه بحقه في استرداد ما سدده من العوائد، وفي نصيبه منها وفق المادة الثامنة من الدليل، وبالحوافز المالية الواردة في اللوائح ذات العلاقة."}, {"n": "ب", "t": "طلب تنازل الجامعة له عن حقها في الاختراع ليودعه باسمه وعلى نفقته، فيكون التنازل بتوصية من اللجنة الدائمة واعتماد صاحب الصلاحية، بموجب اتفاقية تنازل مكتوبة. ويُرجع في المزايا المترتبة على إيداع الطلب أو منح البراءة إلى الأنظمة واللوائح ذات العلاقة. وتحتفظ الجامعة بحق غير حصري لاستخدام الاختراع في البحث والتعليم دون مقابل، وبنسبة من العوائد مقابل ما استُخدم من مواردها، إن وُجدت، تحددها اتفاقية التنازل."}]}, {"n": "٤", "t": "في حال اختيار المبتكر الإيداع باسم الجامعة وفق الفقرة (أ) من البند (٣)، يوقّع اتفاقية التنازل، ويتحمّل الرسوم وفق اتفاقية التنازل المعتمدة لهذا المسار.", "sub": []}, {"n": "٥", "t": "يسدد المبتكر الرسوم للجهة المختصة مباشرةً خلال مدة صلاحية الفاتورة، ويرفع إيصال السداد عبر المنصة المعتمدة فور السداد، ويتحمّل وحده ما يترتب على عدم السداد خلال المدة المحددة له.", "sub": []}, {"n": "٦", "t": "يتابع مكتب نقل التقنية مواعيد السداد والقرارات الصادرة عن جهات الإيداع محلياً ودولياً، ويبلّغ المبتكر بها عبر المنصة المعتمدة والبريد الإلكتروني الرسمي، ويُعدّ التبليغ نافذاً من تاريخ إرساله ولو لم يؤكد المبتكر استلامه. ويلتزم المبتكر بتأكيد استلام التبليغات، وبالسداد خلال مدة صلاحية الفاتورة (أي في موعد أقصاه تاريخ السداد المحدد في الفاتورة المرسلة إليه)، وفق آليات السداد المتاحة لدى جهة الإيداع.", "sub": []}, {"n": "٧", "t": "إذا انقضت مدة صلاحية الفاتورة دون أن يرفع المبتكر ما يثبت السداد، عُدّ متوقفاً عن السداد، ويُعرض الأمر على اللجنة الدائمة لاتخاذ قرار بأحد أمرين:", "sub": [{"n": "أ", "t": "أن تتولى الجامعة السداد حفاظاً على الحق."}, {"n": "ب", "t": "أن تمتنع الجامعة عن السداد، فيُعدّ الطلب أو البراءة متروكاً، ويسقط الحق المترتب عليه لدى جهة الإيداع، دون أن يترتب على الجامعة أي التزام تجاه المبتكر."}]}, {"n": "٨", "t": "يسترد المبتكر ما سدده من رسوم من إجمالي العوائد المتحققة من استثمار البراءة؛ إذ يُخصم من إجمالي العوائد أولاً مبلغ يعادل ما سدده من رسوم ويُصرف له، ثم يُحتسب صافي العوائد ويُوزَّع وفق المادة الثامنة من الدليل. ويكون الاسترداد في حدود العوائد المتحققة، فإن لم تتحقق عوائد فلا يُعد ما سدده ديناً على الجامعة.", "sub": []}]}, {"name": "المسار الثالث", "title": "الابتكارات المرتبطة ببحث أو مشروع ممول أو محتضن من الجامعة", "intro": "يُعمل بهذا المسار إذا كانت براءة الاختراع أحد مخرجات البحث أو المشروع الممول أو المحتضن من الجامعة، المنصوص عليها في العقد المبرم، سواء أكانت شرطاً من شروط إغلاقه أم أحد خياراته، ويسير وفق الإجراءات الآتية:", "items": [{"n": "١", "t": "يتولى الباحث سداد رسوم البراءة.", "sub": []}, {"n": "٢", "t": "يُودع الطلب محلياً / دولياً بحسب ما تقرره اللجنة الدائمة.", "sub": []}, {"n": "٣", "t": "إذا جاء تقرير الأهلية بتصنيف «غير واعد»، أو خلص إلى عدم قابلية الاختراع للحماية ببراءة اختراع (Patentability)، فلا يُودع الطلب، ويحيل مكتب نقل التقنية طلب إغلاق ملف الحماية إلى الجهة الممولة أو الحاضنة للمشروع (عمادة، أو كلية، أو مركز، أو كرسي بحثي، أو غيرها)، لتتولى إغلاقه وفق الإجراءات المعتمدة لديها. ولا يترتب على ذلك إغلاق المشروع البحثي أو المحتضن، ولا المساس بحقوق الملكية الفكرية للأطراف، ولا يمنع المبتكر من إيداع الطلب على نفقته وفق المسار الثاني.", "sub": []}, {"n": "٤", "t": "لا يسترد الباحث من العوائد الرسوم المسددة من التمويل البحثي، بوصفها مسددة من تمويل الجامعة لا من ماله الخاص؛ فلا يُخصم مقابلها شيء من إجمالي العوائد، وتوزَّع العوائد وفق المادة الثامنة من الدليل.", "sub": []}, {"n": "٥", "t": "إذا انتهت مدة التمويل أو الاحتضان، أو لم تكفِ المخصصات المالية لتغطية رسوم البراءة، أو تعذّر السداد منها لصرفها في بنود أخرى، يُعرض الطلب على اللجنة الدائمة لتحديد مسار استكمال الحماية وفق المسار الأول أو الثاني، بالتنسيق مع الجهة الممولة أو الحاضنة. وتوزَّع العوائد وفق المادة الثامنة من الدليل؛ فلا يُسترد منها ما سُدِّد من التمويل، ويسترد المبتكر منها ما سدده من ماله الخاص وفق أحكام المسار الثاني.", "sub": []}]}, {"name": "المسار الرابع", "title": "طلبات التنازل عن البراءات للجامعة", "intro": "يختص هذا المسار بالبراءات الممنوحة التي أودعها المبتكر بصفته الشخصية، لا باسم الجامعة، ويبدأ عند رغبته في التنازل عنها للجامعة، ويسير وفق الإجراءات الآتية:", "items": [{"n": "١", "t": "لا يُقبل التنازل للجامعة إلا عن براءة ممنوحة.", "sub": []}, {"n": "٢", "t": "يقدّم المبتكر طلب التنازل عبر المنصة المعتمدة، مرفقاً به وثيقة البراءة.", "sub": []}, {"n": "٣", "t": "للجامعة قبول التنازل أو رفضه بناءً على توصية من اللجنة الدائمة واعتماد صاحب الصلاحية، ولا يُعد تقديم المبتكر طلب التنازل ملزماً للجامعة بقبوله، وتحدد اللجنة الدائمة في توصيتها المسار الذي تُعامَل البراءة وفقه.", "sub": []}, {"n": "٤", "t": "عند القبول، تُوقَّع اتفاقية التنازل، ويُسجَّل نقل الملكية باسم الجامعة لدى الهيئة السعودية للملكية الفكرية أو المكاتب الدولية، ويكون تحمّل رسوم نقل الملكية ورسوم المحافظة على البراءة وفق المسار الذي حددته اللجنة الدائمة، وتُطبَّق عليها أحكام ذلك المسار.", "sub": []}]}, {"name": "المسار الخامس", "title": "البراءات ذات الشراكة مع جهات خارجية", "intro": "يُعمل بهذا المسار إذا كان الاختراع ناتجاً عن شراكة بين الجامعة وجهة خارجية، ويسير وفق الإجراءات الآتية:", "items": [{"n": "١", "t": "إذا وُجدت اتفاقية مع الجهة الخارجية، يُعمل بما تنص عليه الاتفاقية بشأن تحمّل التكاليف.", "sub": []}, {"n": "٢", "t": "إذا لم توجد اتفاقية، تُوزَّع التكاليف بحسب نسب المبتكرين الواردة في اتفاقية التنازل.", "sub": []}, {"n": "٣", "t": "يُعامَل الاختراع الناتج عن الشراكة وفق اتفاقية المساهمة المعتمدة، التي توضح نسب مساهمة كل طرف وحصته في الملكية، ما لم تنص اتفاقية الشراكة على خلاف ذلك.", "sub": []}, {"n": "٤", "t": "تُحدَّد الملكية الفكرية السابقة لكل طرف قبل إبرام اتفاقية الشراكة والتنازل.", "sub": []}, {"n": "٥", "t": "يُبرم للاختراع الناتج عن الشراكة اتفاقية تنازل خاصة به لإدارته، تحدد الطرف المسؤول عن الإيداع والمتابعة والترخيص للغير، وآلية تقاسم رسوم البراءة ومصاريفها، وآلية توزيع العوائد، ما لم تتضمن اتفاقية الشراكة ما ينص على ذلك.", "sub": []}, {"n": "٦", "t": "إذا امتنع الشريك عن سداد حصته من الرسوم، أو رغب في التخلي عن حقه، فللجامعة، بقرار من اللجنة الدائمة، أن تتولى سداد حصته مقابل زيادة حصتها في الملكية بقدر ما سددته، أو أن تمتنع عن ذلك، ويُشعَر الشريك رسمياً بقرار اللجنة الدائمة. فإن امتنعت، عُدّ الطلب أو البراءة متروكاً، وسقط الحق لدى جهة الإيداع، ويترتب على ذلك:", "sub": [{"n": "أ", "t": "زوال الحماية عن الاختراع، وجواز استغلاله من الغير دون مقابل."}, {"n": "ب", "t": "سقوط حقوق الطرفين في أي عوائد مستقبلية مترتبة على البراءة."}, {"n": "ج", "t": "عدم أحقية أي من الطرفين في استرداد ما سدده من رسوم سابقة."}, {"n": "د", "t": "تحمّل الشريك الممتنع ما يترتب على امتناعه وفق ما تنص عليه اتفاقية الشراكة، دون أن يُعد ذلك إخلالاً من الجامعة بالتزاماتها."}]}, {"n": "٧", "t": "لا يحق لأي من منسوبي الجامعة إبرام اتفاقية تنازل تتعلق بملكية اختراع مع جهة خارجية نيابةً عن الجامعة إلا بتفويض منها.", "sub": []}, {"n": "٨", "t": "إذا قررت اللجنة الدائمة عدم تحمّل الجامعة لحصتها من الرسوم، وعُرض على المبتكر من منسوبي الجامعة تحمّلها وفق المسار الثاني فلم يقبل، فللجنة الدائمة أن تقرر أحد الخيارين الآتيين:", "sub": [{"n": "أ", "t": "أن يتحمّل الشريك حصة الجامعة من الرسوم، مقابل زيادة حصته في الملكية بقدر ما سدده."}, {"n": "ب", "t": "أن تتنازل الجامعة عن حصتها للشريك بموجب عقد تنازل يحفظ الحق الأدبي للمبتكر من منسوبيها، ويحدد ما يستحقه هو والجامعة من عوائد مستقبلية، ويحتفظ للجامعة بحق استخدام الاختراع لأغراض البحث والتعليم دون مقابل."}]}, {"n": "٩", "t": "لا يحق للشريك التنازل عن حصته في الطلب أو البراءة للغير إلا بموافقة مسبقة من الجامعة، أو بعد منحها أولوية شراء تلك الحصة، ويُنص على ذلك في اتفاقية الشراكة.", "sub": []}]}], "gp": {"label": "رابعاً", "title": "أحكام عامة", "intro": "", "items": [{"n": "١", "t": "يكون الإيداع لدى الهيئة السعودية للملكية الفكرية ابتداءً، وإذا رأت اللجنة الدائمة جدوى من الإيداع الدولي، يكون ذلك بقرار منها، على أن يكون الإيداع لدى الهيئة قبل أي إيداع أجنبي، ولا يجوز للمبتكر الإيداع خارج المملكة بنفسه.", "sub": []}, {"n": "٢", "t": "يقدّم المبتكر مع أي طلب يُعرض على اللجنة الدائمة تقرير أهلية البراءة، الذي يبيّن أصالة الفكرة وقابليتها لمنح البراءة، على أن يكون التقرير من الجهات أو وفق النماذج التي تعتمدها اللجنة الدائمة، ولا يُقبل أي طلب دونه، عدا طلبات التنازل عن البراءات الممنوحة وفق المسار الرابع. ولا تكون نتيجة التقرير ملزمة للجنة؛ فلها أن تأخذ بما انتهى إليه، أو أن تقرر خلافه وفق ما تراه.", "sub": []}, {"n": "٣", "t": "تكون الملكية الفكرية لأي طلب للجامعة، ويُودع الطلب باسمها في جميع المسارات، متى كان الاختراع ناتجاً عن مهام عمل المبتكر، أو طُوِّر باستخدام تمويل الجامعة أو معاملها أو مرافقها أو مواردها، أو كان ناتجاً عن مشروع تخرج أو بحث طلابي، بما في ذلك مشاريع التخرج والرسائل العلمية والأبحاث الناتجة عن الابتعاث أو الإيفاد وفق اللوائح العامة للابتعاث، على أن يكون انتماء المبتكر (Affiliation) لجامعة تبوك في الطلب وفي ما يتصل به من نشر علمي، وذلك وفق المادتين الثامنة والخامسة عشرة من دليل سياسات الملكية الفكرية والحاضنة. ويُثبت المبتكر بصفة المخترع. وإذا كان للجهة المستضيفة حق في الاختراع وفق سياساتها، يُعامل الطلب وفق المسار الخامس.", "sub": []}, {"n": "٤", "t": "إذا كان صاحب الحق في طلب البراءة طرفاً آخر غير الجامعة، يتولى دفع الرسوم المقررة، ولا تتحمل الجامعة أي مصاريف بشأنه.", "sub": []}, {"n": "٥", "t": "لا يحق للمبتكر، من أعضاء هيئة التدريس، أو الموظفين، أو الطلاب، أو الباحثين الزائرين ومن في حكمهم، أو غيرهم ممن تسري عليهم سياسات الجامعة، تسجيل براءة اختراع أو أي حق من حقوق الملكية الفكرية تملكه الجامعة، بنفسه أو مع أي طرف آخر، دون إخطار مكتب نقل التقنية والحصول على موافقته.", "sub": []}, {"n": "٦", "t": "لا يُعد إيداع الطلب بذاته إذناً بنشر الاختراع أو الإفصاح عنه، ويكون النشر بموافقة مسبقة من مكتب نقل التقنية، وفق أحكام الهيئة السعودية للملكية الفكرية، وأحكام مكاتب الإيداع الدولية المعتمدة من المجلس العلمي في حال الإيداع الدولي. واستثناءً من ذلك، لا يُعد الكشف عن الاختراع لأغراض البحث العلمي تقنيةً سابقة إذا تم خلال اثني عشر (12) شهراً قبل تاريخ إيداع الطلب، بشرط ألا يكون لغرض الاستغلال التجاري، وأن تكون المملكة أول دولة يُودع فيها الطلب، ولا يُلجأ إلى هذا الاستثناء إلا بموافقة مكتب نقل التقنية.", "sub": []}, {"n": "٧", "t": "لا تتسلم الجامعة أي مبالغ من المبتكر؛ فإذا كان المبتكر هو المتحمّل للرسوم، يرسل إليه مكتب نقل التقنية فاتورة الرسوم الصادرة عن الجهة المختصة، ويتولى سدادها مباشرةً لتلك الجهة. أما الرسوم التي تتحمّلها الجامعة، فتتولى سدادها للجهة المختصة مباشرةً.", "sub": []}, {"n": "٨", "t": "تُقدَّم جميع الطلبات عبر المنصة المعتمدة، ويكون التواصل والتبليغ مع المبتكر عبر المنصة والبريد الإلكتروني الرسمي في جميع المراحل. ويُعد التبليغ نافذاً من تاريخ إرساله، ومتابعته مسؤولية المبتكر، ولا يُعتد بطلبات المبتكر وردوده إلا عبرهما.", "sub": []}, {"n": "٩", "t": "إذا سقط أي حق لعدم سداد الرسوم لطلب مودع باسم الجامعة، أياً كان مسار الحماية الذي تُتحمّل الرسوم وفقه، فللجامعة وحدها، بقرار من اللجنة الدائمة، تقديم طلب إعادة سريان الطلب أو وثيقة الحماية أو عدم تقديمه، ويعود إلى اللجنة الدائمة تقدير الظروف الخارجة عن الإرادة التي تسوّغ ذلك. ولا يُعد ذلك إخلالاً من الجامعة بالتزاماتها، ولا يترتب عليه حق في التعويض أو استرداد الرسوم.", "sub": []}, {"n": "١٠", "t": "إذا تعدد المبتكرون، يُعتد في التعامل بالمبتكر المفوَّض من الفريق الابتكاري وفق النموذج المعتمد، بصفته ممثلاً عن الفريق كاملاً. ويكون هو المعني بتقديم الطلبات والرد على المراسلات، ويُعد تبليغه تبليغاً لجميع أعضاء الفريق. وإذا كان من بين المبتكرين طلاب، يكون المشرف الأكاديمي هو الممثل عن الفريق الابتكاري، بتفويض من الفريق كاملاً، ويستمر في ذلك إذا تخرج الطالب أو انقطعت علاقته بالجامعة، مع حفظ حقوق الطالب الأدبية والمالية.", "sub": []}, {"n": "١١", "t": "لا يجوز بعد تقديم الطلب إضافة عضو إلى الفريق الابتكاري أو استبعاده، أو تعديل نسب المساهمة، إلا بطلب مكتوب يرسل عبر المنصة المعتمدة يوقّعه جميع أعضاء الفريق، مع تحديث سجل توثيق المساهمة، وبموافقة اللجنة الدائمة. وإذا لم تُوثَّق نسب المساهمة، كان الحق للمبتكرين بالتساوي.", "sub": []}, {"n": "١٢", "t": "يتحمّل المبتكر وحده المسؤولية النظامية والمالية عن صحة البيانات والمعلومات والمستندات التي يقدّمها واكتمالها، وعن أي شكوى أو نزاع أو دعوى تنشأ عن عدم صحتها أو نقصها، ولا تتحمّل الجامعة أي مسؤولية عن ذلك.", "sub": []}, {"n": "١٣", "t": "يلتزم المبتكر بردّ جميع ما سددته الجامعة من رسوم أو تكاليف على الطلب أو البراءة، أياً كان مسار الحماية الذي سُدِّدت وفقه، في أيٍّ من الحالات الآتية:", "sub": [{"n": "أ", "t": "عدم تعاونه في أي إجراء يتطلبه الطلب خلال المدد المحددة، كالرد على تقارير الفحص، أو تعديل الطلب، أو تقديم البيانات أو المستندات التي يطلبها مكتب الإيداع أو مكتب نقل التقنية، إذا تعثّر الطلب أو سقط بسبب ذلك."}, {"n": "ب", "t": "ثبوت عدم صحة البيانات أو المعلومات أو الإقرارات التي قدّمها، أو نقصها، إذا ترتب على ذلك رفض الطلب أو إبطال البراءة أو سقوطها."}, {"n": "ج", "t": "نشره الاختراع أو الإفصاح عنه للغير قبل الإيداع دون التنسيق مع مكتب نقل التقنية، إذا ترتب على ذلك فقدان الاختراع جدته أو رفض الطلب."}, {"n": "د", "t": "إيداعه الاختراع أو تسجيله أو التصرف فيه، بنفسه أو مع الغير، دون موافقة مكتب نقل التقنية، بالمخالفة لحكم البند (5)."}, {"n": "هـ", "t": "إخفاؤه وجود حق لجهة أخرى في الاختراع، كجهة عمل سابقة أو جهة مستضيفة أو جهة ممولة أو شريك، أو إغفاله ذكر أحد المساهمين فيه، إذا ترتب على ذلك نزاع أو رفض للطلب أو سقوط للحق."}, {"n": "و", "t": "ثبوت أن الاختراع منقول أو منتحل، أو أنه يتعدى على حقوق ملكية فكرية للغير."}, {"n": "ز", "t": "طلبه سحب الطلب أو التخلي عنه بعد سداد الجامعة رسومه، دون مبرر تقبله اللجنة الدائمة."}], "after": ["ويكون ثبوت أيٍّ من هذه الحالات بقرار من اللجنة الدائمة، بعد إبلاغ المبتكر وتمكينه من إبداء ما لديه. ويلتزم المبتكر بالرد خلال المدة التي تحددها الجامعة، استثناءً من حكم البند (7)، دون الإخلال بحق الجامعة في اتخاذ ما تراه من إجراءات نظامية أخرى."]}, {"n": "١٤", "t": "للمبتكر التظلم من قرارات اللجنة الدائمة الصادرة تطبيقاً لهذه الحوكمة، ومنها القرارات الصادرة وفق البند (13)، خلال ثلاثين يوماً من تاريخ تبليغه بالقرار عبر المنصة المعتمدة، ويُرفع التظلم إلى صاحب الصلاحية للبت فيه، ويكون قراره نهائياً.", "sub": []}, {"n": "١٥", "t": "لمكتب نقل التقنية، بحسب مصلحة الطلب: إيداع الطلب بوصفٍ بأي لغة للحصول على تاريخ الإيداع، على أن تُقدَّم ترجمة معتمدة للوصف خلال المدة التي تحددها اللائحة التنفيذية؛ وطلب تمديد المدد المحددة ستين (60) يوماً، عدا مدة سداد المقابل المالي السنوي؛ وطلب تقديم موعد نشر الطلب أو تأجيله.", "sub": []}, {"n": "١٦", "t": "لا يُحتج بالترخيص باستغلال البراءة في مواجهة الغير ما لم يُسجَّل لدى الهيئة السعودية للملكية الفكرية ويُنشر، ويكون الترخيص غير حصري ما لم يُتفق على غير ذلك.", "sub": []}]}, "trans": {"label": "خامساً", "title": "أحكام انتقالية", "intro": "", "items": [{"n": "١", "t": "يُقصد بـ«البراءات القائمة» في هذا الباب: كل طلب براءة أُودع باسم الجامعة، منفردةً أو بالمشاركة مع غيرها، قبل تاريخ نفاذ هذه الحوكمة، سواء أكان قيد الفحص أم ممنوحاً. ولا تُعاد إحالة هذه البراءات إلى اللجنة الدائمة لتحديد مسارها، بل يُحدَّد مسارها تلقائياً بحسب وضعها وقت الإيداع، وفق البند (3) من هذا الباب.", "sub": []}, {"n": "٢", "t": "تبقى ملكية البراءات القائمة وما يترتب عليها من حقوق والتزامات على ما تقرر وقت إيداعها، وفق عقود التمويل والاتفاقيات الموقّعة والسياسات المعمول بها حينئذٍ. ولا يمس تطبيق هذه الحوكمة أي حق مكتسب للمبتكر أو للجامعة أو للغير.", "sub": []}, {"n": "٣", "t": "تُعامَل البراءات القائمة، فيما يُتخذ بشأنها من إجراءات بعد نفاذ هذه الحوكمة، وفق المسار المقابل لوضعها وقت الإيداع، على النحو الآتي:", "sub": [{"n": "أ", "t": "الناتجة عن بحث أو مشروع ممول أو محتضن من الجامعة: وفق شروط عقد التمويل أو الاحتضان، وفيما لم ينظمه العقد وفق المسار الثالث."}, {"n": "ب", "t": "التي تحمّلت الجامعة رسومها: وفق المسار الأول."}, {"n": "ج", "t": "التي تحمّل المبتكر رسومها: وفق المسار الثاني."}, {"n": "د", "t": "المشتركة مع جهة خارجية: وفق اتفاقية الشراكة، وفيما لم تنظمه وفق المسار الخامس."}], "after": ["وتصدر القرارات المتعلقة بها، ومنها سداد رسوم الصيانة والترخيص والتسويق والتخلي، من اللجنة الدائمة."]}, {"n": "٤", "t": "لا تتخلى الجامعة عن براءة قائمة أو تتوقف عن سداد رسومها إلا بعد إشعار المبتكر عبر المنصة المعتمدة/البريد الإلكتروني الرسمي، ومنحه مهلة ثلاثين (30) يوماً من تاريخ الإشعار ليُبدي رغبته في تحمّل الرسوم. فإن أبدى رغبته، أُتيح له ذلك وفق المسار الثاني بقرار من اللجنة الدائمة. وإن انقضت المهلة دون رد، جاز للجامعة التخلي عن البراءة دون أن يترتب عليها أي التزام تجاهه. ويكون التخلي بطلب مكتوب يُقدَّم إلى الهيئة السعودية للملكية الفكرية، ولا يجوز التخلي عن براءة مرخَّصة إلا بموافقة المرخَّص له.", "sub": []}, {"n": "٥", "t": "البراءات المودَعة قبل نفاذ هذه الحوكمة باسم المبتكر وحده، مع ثبوت تمويل الجامعة لها أو دعمها، تُعالَج كل حالة منها على حدة بالتنسيق مع المبتكر وبقرار من اللجنة الدائمة. ولا تسري عليها أحكام هذا الباب إلا بعد توقيع اتفاقية التنازل.", "sub": []}]}, "review": {"label": "سادساً", "title": "المراجعة والتعديل", "intro": "للجنة تعديل هذه الحوكمة مستقبلاً. ويرفع مكتب نقل التقنية إلى اللجنة الدائمة تقريراً نصف سنوي يتضمن: عدد الإفصاحات في كل مسار، وعدد الطلبات التي تحمّلت الجامعة رسومها، وعدد الطلبات القائمة، وحالات السقوط، والرسوم التي تحمّلها المبتكرون، والمبالغ المستردة.", "items": []}, "exec": {"label": "سابعاً", "title": "التنفيذ", "intro": "يُعمل بهذه الحوكمة من تاريخ اعتمادها من صاحب الصلاحية، وتسري أحكامها على ما يُقدَّم من طلبات بعد ذلك التاريخ، وعلى الطلبات والبراءات القائمة قبله وفق ما ورد في الأحكام الانتقالية.", "items": []}}</script>
<script id="faqd" type="application/json">[["عام", "لمن تكون ملكية الاختراع؟", "تكون الملكية للجامعة، ويُودع الطلب باسمها في جميع المسارات، متى كان الاختراع ناتجاً عن مهام عمل المبتكر، أو طُوِّر باستخدام تمويل الجامعة أو معاملها أو مرافقها أو مواردها، أو كان ناتجاً عن مشروع تخرج أو بحث طلابي أو رسالة علمية أو ابتعاث. ويُثبت المبتكر بصفة المخترع، ويكون انتماؤه لجامعة تبوك في الطلب وفي النشر العلمي المتصل به.", "الأحكام العامة، البند 3", []], ["عام", "كيف أقدّم طلب الحماية؟", "عبر المنصة المعتمدة، مرفقاً به تقرير أهلية البراءة. ويكون التواصل والتبليغ في جميع المراحل عبر المنصة والبريد الإلكتروني الرسمي، ولا يُعتد بطلبات المبتكر وردوده إلا عبرهما.", "الأحكام العامة، البندان 2 و8", [1]], ["عام", "هل تقرير الأهلية إلزامي؟", "نعم، لا يُقبل أي طلب دونه، عدا طلبات التنازل عن البراءات الممنوحة وفق المسار الرابع. ويُعدّ التقرير من الجهات أو وفق النماذج التي تعتمدها اللجنة الدائمة، ونتيجته غير ملزمة للجنة.", "الأحكام العامة، البند 2", [1, 3]], ["عام", "هل يُعرض كل طلب على اللجنة الدائمة؟", "نعم، يُعرض كل طلب على اللجنة الدائمة في جميع المسارات؛ فهي التي تحدد مساره وتحمّل رسومه، وتقرر الإيداع المحلي أو الدولي، وتوصي بقبول التنازل في المسار الرابع، وتبت في حالات التوقف عن السداد وامتناع الشريك. ولا يُعد ما تعرضه هذه المنصة من مسار متوقع قراراً.", "الحوكمة العامة، والأحكام العامة، والمسارات الخمسة", [1, 2, 3, 4, 5]], ["عام", "من يحدد المسار الذي يُعامَل وفقه طلبي؟", "اللجنة الدائمة؛ فهي تدرس جدوى الإيداع وتقرير الأهلية، وتقرر لكل طلب ما إذا كانت الجامعة ستتحمّل الرسوم وفق الميزانية المعتمدة. وإذا لم تتحمّلها، جاز للمبتكر تحمّلها وفق المسار الثاني.", "الحوكمة العامة، والمسار الأول", []], ["عام", "هل يمكن الإيداع خارج المملكة؟", "نعم، إذا رأت اللجنة الدائمة جدوى من الإيداع الدولي وقررت ذلك، على أن يكون الإيداع لدى الهيئة السعودية للملكية الفكرية قبل أي إيداع أجنبي. ولا يجوز للمبتكر الإيداع خارج المملكة بنفسه. وإذا تعلق الاختراع بالأمن الوطني فلا يُودع خارج المملكة قبل موافقة الهيئة.", "الأحكام العامة، البند 1، والحوكمة العامة", []], ["عام", "هل يحق لي تسجيل الاختراع باسمي؟", "لا يحق لأي من منسوبي الجامعة تسجيل حق تملكه الجامعة، بنفسه أو مع غيره، دون إخطار مكتب نقل التقنية والحصول على موافقته. وفي المسار الثاني يمكن للمبتكر أن يطلب تنازل الجامعة له عن حقها ليودعه باسمه وعلى نفقته، بتوصية من اللجنة الدائمة واعتماد صاحب الصلاحية.", "الأحكام العامة، البند 5، والمسار الثاني", [2]], ["الرسوم", "ما المقصود بالرسوم؟", "جميع الرسوم المتعلقة بالبراءة، ومنها رسوم الإيداع والفحص والتسجيل والصيانة، ويشمل ذلك المقابل المالي المنصوص عليه في الأنظمة ذات العلاقة.", "الحوكمة العامة", []], ["الرسوم", "هل أسدّد الرسوم للجامعة؟", "لا، الجامعة لا تتسلم أي مبالغ من المبتكر. يرسل إليك مكتب نقل التقنية فاتورة الرسوم الصادرة عن الجهة المختصة، وتسددها لها مباشرة، ثم ترفع إيصال السداد عبر المنصة.", "الأحكام العامة، البند 7، والمسار الثاني، البند 5", [2, 3]], ["الرسوم", "هل تستمر الجامعة في سداد رسوم الصيانة دائماً؟", "لا بالضرورة؛ تدرس اللجنة الدائمة وثائق البراءات الممنوحة قبل ستين يوماً على الأقل من استحقاق رسوم الصيانة، وتقرر الاستمرار أو التوقف. فإن قررت التوقف أُشعر المبتكر، وأُتيح له تحمّل الرسوم اللاحقة وفق المسار الثاني.", "المسار الأول، البند 4", [1]], ["الرسوم", "ماذا لو لم أرد على عرض تحمّل الرسوم؟", "إذا لم تُبلغ عن اختيارك خلال ثلاثين يوماً من تاريخ التبليغ، عُدّ ذلك عدولاً عن الإيداع، ويُحفظ الملف دون إيداع، مع بقاء حق الجامعة في الاختراع.", "المسار الثاني، البند 2", [2]], ["الرسوم", "ماذا لو تأخرت عن سداد الفاتورة؟", "إذا انقضت مدة صلاحية الفاتورة دون رفع ما يثبت السداد، عُددت متوقفاً عن السداد، ويُعرض الأمر على اللجنة الدائمة لتقرر إما أن تتولى الجامعة السداد حفاظاً على الحق، أو أن تمتنع فيُعدّ الطلب أو البراءة متروكاً ويسقط الحق.", "المسار الثاني، البند 7", [2]], ["الرسوم", "هل أسترد ما سددته من رسوم؟", "في المسار الثاني يُخصم من إجمالي العوائد أولاً ما يعادل ما سددته ويُصرف لك، ثم تُوزَّع العوائد الصافية وفق المادة الثامنة من الدليل؛ وإن لم تتحقق عوائد فلا يُعد ما سددته ديناً على الجامعة. أما في المسار الثالث فلا يُسترد ما سُدِّد من التمويل البحثي.", "المسار الثاني، البند 8، والمسار الثالث، البند 4", [2, 3]], ["الرسوم", "ماذا لو انتهى تمويل المشروع قبل اكتمال الحماية؟", "إذا انتهت مدة التمويل أو الاحتضان، أو لم تكفِ المخصصات أو تعذّر السداد منها، يُعرض الطلب على اللجنة الدائمة لتحديد استكمال الحماية وفق المسار الأول أو الثاني، بالتنسيق مع الجهة الممولة أو الحاضنة.", "المسار الثالث، البند 5", [3]], ["الرسوم", "ماذا يحدث إذا سقط الحق لعدم سداد الرسوم؟", "للجامعة وحدها، بقرار من اللجنة الدائمة، تقديم طلب إعادة سريان الطلب أو وثيقة الحماية أو عدم تقديمه، ولا يترتب على ذلك حق في التعويض أو استرداد الرسوم.", "الأحكام العامة، البند 9", []], ["الرسوم", "متى ألتزم بردّ ما سددته الجامعة؟", "في حالات منها: عدم تعاونك في إجراءات الطلب خلال المدد المحددة، أو عدم صحة البيانات أو نقصها، أو النشر قبل الإيداع دون تنسيق مع المكتب، أو الإيداع دون موافقة المكتب، أو إخفاء حق لجهة أخرى أو إغفال أحد المساهمين، أو ثبوت أن الاختراع منقول أو منتحل، أو طلب سحب الطلب دون مبرر تقبله اللجنة.", "الأحكام العامة، البند 13", []], ["الفريق الابتكاري", "إذا كنا أكثر من مبتكر، من يمثّلنا؟", "المبتكر المفوَّض من الفريق وفق نموذج التفويض المعتمد؛ فهو المعني بتقديم الطلبات والرد على المراسلات، ويُعد تبليغه تبليغاً لجميع الأعضاء. وإذا كان بين المبتكرين طلاب، يكون المشرف الأكاديمي هو الممثل بتفويض من الفريق كاملاً.", "الأحكام العامة، البند 10", [1, 2, 3, 4, 5]], ["الفريق الابتكاري", "هل يمكن إضافة عضو أو استبعاده بعد تقديم الطلب؟", "لا، إلا بطلب مكتوب عبر المنصة يوقّعه جميع أعضاء الفريق، مع تحديث سجل توثيق المساهمة، وبموافقة اللجنة الدائمة. ولا يكفي طلب المبتكر المفوَّض وحده.", "الأحكام العامة، البند 11", []], ["الفريق الابتكاري", "كيف تُحدَّد نسب المبتكرين؟", "وفق سجل توثيق المساهمة واتفاقية التنازل، وإذا لم تُوثَّق نسب المساهمة كان الحق للمبتكرين بالتساوي.", "الأحكام العامة، البند 11", []], ["النشر والسرية", "هل يعني إيداع الطلب أنني أستطيع نشر الاختراع؟", "لا، لا يُعد الإيداع بذاته إذناً بالنشر أو الإفصاح، ويكون النشر بموافقة مسبقة من مكتب نقل التقنية. والنشر قبل الإيداع دون تنسيق مع المكتب قد يُفقد الاختراع جدته، ويُلزمك بردّ ما سددته الجامعة.", "الأحكام العامة، البندان 6 و13", []], ["النشر والسرية", "ماذا أفعل إذا احتجت إطلاع شخص على الاختراع؟", "لا تُطلع أحداً من خارج الفريق قبل التنسيق مع المكتب، ويوقّع من يطّلع على الاختراع اتفاقية عدم الإفصاح. ويتعهد أعضاء الفريق أنفسهم بالسرية بتوقيع تعهد فريق الاختراع. النماذج متاحة في مكتبة النماذج.", "مكتبة النماذج", []], ["مسارات خاصة", "لديّ براءة ممنوحة باسمي، هل يمكنني التنازل عنها للجامعة؟", "نعم وفق المسار الرابع، ولا يُقبل التنازل إلا عن براءة ممنوحة. تقدّم الطلب عبر المنصة مرفقاً به وثيقة البراءة، وللجامعة القبول أو الرفض بتوصية من اللجنة الدائمة، وتحدد اللجنة المسار الذي تُعامَل البراءة وفقه.", "المسار الرابع", [4]], ["مسارات خاصة", "الاختراع ناتج عن شراكة مع جهة خارجية، فمن يتحمّل التكاليف؟", "يُعمل بما تنص عليه اتفاقية الشراكة، فإن لم توجد اتفاقية وُزّعت التكاليف بحسب نسب المبتكرين في اتفاقية التنازل. ولا يحق لأي من منسوبي الجامعة إبرام اتفاقية تنازل مع جهة خارجية نيابةً عن الجامعة إلا بتفويض منها.", "المسار الخامس، البنود 1 و2 و7", [5]], ["مسارات خاصة", "ما حكم البراءات المودعة قبل نفاذ هذه الحوكمة؟", "لا تُعاد إحالتها إلى اللجنة لتحديد مسارها، بل تُعامَل وفق المسار المقابل لوضعها وقت الإيداع، وتبقى ملكيتها وما يترتب عليها على ما تقرر وقت إيداعها، دون مساس بأي حق مكتسب.", "الأحكام الانتقالية", []], ["الاعتراض", "هل يمكنني التظلم من قرار اللجنة الدائمة؟", "نعم، خلال ثلاثين يوماً من تاريخ تبليغك بالقرار عبر المنصة المعتمدة، ويُرفع التظلم إلى صاحب الصلاحية للبت فيه، ويكون قراره نهائياً.", "الأحكام العامة، البند 14", []]]</script>

window.addEventListener('hashchange',render);render();
const toast=document.getElementById('toast');let tt;const say=s=>{toast.textContent=s;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),3200)};
const download=(k,f)=>{const d=DOCS[k],src=f==='docx'?d.docx:f==='full'?d.full:d.pdf;const a=document.createElement('a');a.href='files/'+src[0];a.download=src[1];document.body.appendChild(a);a.click();a.remove();say('جارٍ تنزيل الملف')};
const dlg=document.getElementById('dlg'),db=document.getElementById('db');
const view=k=>{const d=DOCS[k],a=d.from||1;document.getElementById('dt').textContent=d.t;
document.getElementById('da').innerHTML=`<button class="btn pri" data-dl="${k}" data-f="pdf">تنزيل PDF</button>${d.docx?`<button class="btn ghost" data-dl="${k}" data-f="docx">Word</button>`:''}`;
let s='';for(let p=a;p<=d.n;p++)s+=`<img loading="lazy" src="img/${d.img}-p${p}.webp" alt="الصفحة ${p-a+1}">`;db.innerHTML=s;db.scrollTop=0;
if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','')};
document.getElementById('dx').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
document.addEventListener('click',e=>{const t=e.target.closest('[data-view],[data-dl],[data-q],[data-reset],[data-jump],[data-cat]');if(!t)return;
if(t.dataset.cat){fc=t.dataset.cat;document.querySelectorAll('.cats button').forEach(x=>x.classList.toggle('on',x.dataset.cat===fc));document.getElementById('fb').innerHTML=faqBody();return}
if(t.dataset.view){e.preventDefault();view(t.dataset.view)}
else if(t.dataset.dl){e.preventDefault();download(t.dataset.dl,t.dataset.f)}
else if(t.dataset.q){const j=+t.dataset.q;qa=qa.slice(0,j);qa[j]=t.dataset.v==='1';document.getElementById('helper').innerHTML=helper()}
else if(t.dataset.reset){qa=[];document.getElementById('helper').innerHTML=helper()}
else if(t.dataset.jump){e.preventDefault();document.getElementById(t.dataset.jump)?.scrollIntoView({behavior:'smooth'})}});
let gt;document.addEventListener('input',e=>{if(e.target.id==='fs'){fq=e.target.value;clearTimeout(gt);gt=setTimeout(()=>{document.getElementById('fb').innerHTML=faqBody()},180);return}if(e.target.id==='gs'){gq=e.target.value;clearTimeout(gt);gt=setTimeout(()=>{document.getElementById('gb').innerHTML=govBody()},180)}});
}
</script>
</body>
</html>
